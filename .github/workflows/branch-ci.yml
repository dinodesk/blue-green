name: Branch CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PR version identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.pull_request.number }}"
          major="0"
          minor="1"
          revision="${GITHUB_RUN_NUMBER}"
          version="${major}.${minor}.${pr_number}.${revision}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/test_api.py

      - name: Build and verify versioned image
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE_TAG="blue-green:ci-${APP_VERSION}"
          docker buildx build --load -t "${IMAGE_TAG}" .
          docker rm -f blue-green-ci >/dev/null 2>&1 || true
          docker run -d --name blue-green-ci -p 8000:8000             -e APP_VERSION="${APP_VERSION}"             -e ENVIRONMENT="qa"             -e IMAGE_TAG="${APP_VERSION}"             "${IMAGE_TAG}"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            if [ "${attempt}" -eq 30 ]; then docker logs blue-green-ci; exit 1; fi
            sleep 1
          done
          actual="$(curl --fail --silent http://127.0.0.1:8000/version | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "${actual}" = "${APP_VERSION}"

      - name: Run integration tests against Docker
        run: uv run pytest tests/test_integration.py

      - name: Stop Docker test container
        if: always()
        run: docker rm -f blue-green-ci >/dev/null 2>&1 || true
