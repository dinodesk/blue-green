name: Allocate Main Release Version

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Major application version"
        required: true
        default: "0"
        type: string
      minor:
        description: "Minor application version"
        required: true
        default: "1"
        type: string
      release:
        description: "Release line selected for this UAT/production release"
        required: true
        default: "1"
        type: string

concurrency:
  group: main-release-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and allocate release version
        id: version
        shell: bash
        env:
          MAJOR: ${{ inputs.major }}
          MINOR: ${{ inputs.minor }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          for value in "${MAJOR}" "${MINOR}" "${RELEASE}"; do
            if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "Major, Minor and Release must all be non-negative integers."
              exit 1
            fi
          done

          major="${MAJOR}"
          minor="${MINOR}"
          release="${RELEASE}"

          latest_release="$(
            git tag -l "v${major}.${minor}.*.*" |
              sed -E "s/^v${major//./\\.}\.${minor//./\\.}\.([0-9]+)\.[0-9]+$/\1/" |
              grep -E '^[0-9]+$' |
              sort -n |
              tail -n 1 || true
          )"

          if [ -n "${latest_release}" ] && [ "${release}" -lt "${latest_release}" ]; then
            echo "Selected release ${release} is lower than the latest release ${latest_release} for ${major}.${minor}."
            echo "Choose the current release line to create another revision, or a higher release number for a new release line."
            exit 1
          fi

          latest_revision="$(
            git tag -l "v${major}.${minor}.${release}.*" |
              sed -E "s/^v${major//./\\.}\.${minor//./\\.}\.${release//./\\.}\.([0-9]+)$/\1/" |
              grep -E '^[0-9]+$' |
              sort -n |
              tail -n 1 || true
          )"

          if [ -z "${latest_revision}" ]; then
            revision=1
          else
            revision=$((latest_revision + 1))
          fi

          version="${major}.${minor}.${release}.${revision}"
          tag="v${version}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists."
            exit 1
          fi

          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${version}"
          git push origin "${tag}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "release=${release}"
            echo "revision=${revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release identity
        run: |
          echo "Official release version: ${{ steps.version.outputs.version }}"
          echo "Release line: ${{ steps.version.outputs.release }}"
          echo "Revision: ${{ steps.version.outputs.revision }}"
          echo "Source commit: ${GITHUB_SHA}"
          echo "PR/Jira tickets are traceability metadata; Release is not tied to a single PR."
          echo "The version is immutable because it is recorded as a Git tag on the selected main commit."
