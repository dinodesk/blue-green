name: Allocate Main Release Version

on:
  push:
    branches:
      - main

concurrency:
  group: main-release-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR and allocate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh api --header 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].number')"
          pr_number="$(printf '%s\n' "${prs}" | head -n 1)"
          if [ -z "${pr_number}" ]; then
            echo "Unable to determine merged PR for ${GITHUB_SHA}."
            exit 1
          fi

          major="0"
          minor="1"
          release="${pr_number}"
          latest_revision="$(git tag -l "v${major}.${minor}.${release}.*" | sed "s/^v${major}\.${minor}\.${release}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
          if [ -z "${latest_revision}" ]; then
            revision=1
          else
            revision=$((latest_revision + 1))
          fi

          version="${major}.${minor}.${release}.${revision}"
          tag="v${version}"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${version}"
          git push origin "${tag}"

          echo "Official release: ${version}"
          echo "Release / PR / Jira story: ${pr_number}"
          echo "Revision: ${revision}"
